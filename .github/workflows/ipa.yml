name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [sideload-build, object-capture]
jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/house-capture
        run: xcodegen generate
      - name: Build (no signing)
        working-directory: apps/house-capture
        run: |
          xcodebuild -project HouseCapture.xcodeproj -scheme HouseCapture -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tail -80; test ${PIPESTATUS[0]} -eq 0
          test -f build/Build/Products/Release-iphoneos/HouseCapture.app/HouseCapture
      - name: Package IPA
        working-directory: apps/house-capture
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/HouseCapture.app Payload/
          zip -qr 3DModelAnything-unsigned.ipa Payload
          ls -la 3DModelAnything-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: 3DModelAnything-unsigned-ipa
          path: apps/house-capture/3DModelAnything-unsigned.ipa
